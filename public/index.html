<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة أكاديمية اللغات</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 600px; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 25px; font-size: 1.6rem; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background-color: #fff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background-color: #10b981; color: white; margin-top: 10px; }
        .btn-add:hover { background-color: #059669; }
        .btn-delete { background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .table-container { overflow-x: auto; margin-top: 25px; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; min-width: 450px; }
        th { background-color: #1e293b; color: white; padding: 12px 8px; }
        td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
        .auth-screen { text-align: center; padding: 20px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة الدخول -->
    <div id="authScreen" class="auth-screen">
        <h2>🎓 دخول النظام</h2>
        <div class="form-group">
            <input type="password" id="pinInput" placeholder="أدخل رمز PIN (1234)">
        </div>
        <button class="btn-add" onclick="login()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="appScreen" class="hidden">
        <h1>🎓 نظام إدارة أكاديمية اللغات</h1>
        
        <form id="studentForm" onsubmit="addStudent(event)">
            <div class="form-group">
                <input type="text" id="name" placeholder="اسم الطالب" required>
            </div>
            <div class="form-group">
                <select id="language" required>
                    <option value="">اختر اللغة</option>
                    <option value="الإنجليزية">الإنجليزية</option>
                    <option value="الفرنسية">الفرنسية</option>
                    <option value="الإسبانية">الإسبانية</option>
                    <option value="الألمانية">الألمانية</option>
                    <option value="التركية">التركية</option>
                </select>
            </div>
            <div class="form-group">
                <select id="level" required>
                    <option value="">اختر المستوى</option>
                    <option value="مبتدئ (A1-A2)">مبتدئ (A1-A2)</option>
                    <option value="متوسط (B1-B2)">متوسط (B1-B2)</option>
                    <option value="متقدم (C1-C2)">متقدم (C1-C2)</option>
                </select>
            </div>
            <div class="form-group">
                <select id="payment" required>
                    <option value="خالص">تم الدفع (خالص)</option>
                    <option value="غير خالص">غير خالص (معلق)</option>
                </select>
            </div>
            <button type="submit" class="btn-add">إضافة طالب جديد</button>
        </form>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>اللغة</th>
                        <th>المستوى</th>
                        <th>حالة الدفع</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let authToken = '';

    function login() {
        const pin = document.getElementById('pinInput').value;
        if (pin === '1234') {
            authToken = pin;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadStudents();
        } else {
            alert('رمز PIN غير صحيح!');
        }
    }

    async function loadStudents() {
        try {
            const res = await fetch('/api/students', {
                headers: { 'Authorization': authToken }
            });
            const students = await res.json();
            const tbody = document.getElementById('studentsTable');
            tbody.innerHTML = '';
            
            if (Array.isArray(students)) {
                students.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${student.name || ''}</td>
                        <td>${student.language || ''}</td>
                        <td>${student.level || ''}</td>
                        <td><b style="color: ${student.payment === 'خالص' ? '#10b981' : '#ef4444'}">${student.payment || ''}</b></td>
                        <td>${student.date || '-'}</td>
                        <td><button class="btn-delete" onclick="deleteStudent('${student.id}')">حذف</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        } catch (err) {
            console.error('Erreur:', err);
        }
    }

    async function addStudent(e) {
        e.preventDefault();
        const studentData = {
            name: document.getElementById('name').value,
            language: document.getElementById('language').value,
            level: document.getElementById('level').value,
            payment: document.getElementById('payment').value,
            date: new Date().toLocaleDateString('ar-EG')
        };

        await fetch('/api/students', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': authToken
            },
            body: JSON.stringify(studentData)
        });

        document.getElementById('studentForm').reset();
        loadStudents();
    }

    async function deleteStudent(id) {
        if (confirm('هل أنت تأكد من حذف هذا الطالب؟')) {
            await fetch(`/api/students/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': authToken }
            });
            loadStudents();
        }
    }
</script>

</body>
</html>
