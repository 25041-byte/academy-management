<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Online</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 750px; }
        h1, h2, h3 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background-color: #fff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background-color: #10b981; color: white; margin-top: 10px; }
        .btn-add:hover { background-color: #059669; }
        .btn-delete { background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-delete:hover { background-color: #dc2626; }
        .btn-logout { background-color: #64748b; color: white; margin-top: 15px; }
        .btn-logout:hover { background-color: #475569; }
        .table-container { overflow-x: auto; margin-top: 20px; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; min-width: 500px; }
        th { background-color: #1e293b; color: white; padding: 12px 8px; }
        td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
        .auth-screen { text-align: center; padding: 20px 0; }
        .hidden { display: none !important; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-success { background-color: #d1fae5; color: #065f46; }
        .badge-danger { background-color: #fee2e2; color: #991b1b; }
        .stats-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-top: 25px; }
        .teacher-badge { background-color: #3b82f6; color: white; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة الدخول -->
    <div id="authScreen" class="auth-screen">
        <h2>🎓 Academy Online</h2>
        <div class="form-group">
            <input type="password" id="pinInput" placeholder="أدخل رمز الدخول (PIN)">
        </div>
        <button class="btn-add" onclick="login()">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="appScreen" class="hidden">
        <h1>🎓 Academy Online</h1>
        
        <form id="studentForm" onsubmit="addStudent(event)">
            <div class="form-group">
                <input type="text" id="name" placeholder="اسم الطالب" required>
            </div>
            <div class="form-group">
                <select id="language" required>
                    <option value="">اختر اللغة</option>
                    <option value="الإنجليزية">الإنجليزية</option>
                    <option value="الفرنسية">الفرنسية</option>
                    <option value="الإسبانية">الإسبانية</option>
                    <option value="الألمانية">الألمانية</option>
                    <option value="التركية">التركية</option>
                </select>
            </div>
            <div class="form-group">
                <select id="level" required>
                    <option value="">اختر المستوى</option>
                    <option value="مبتدئ (A1-A2)">مبتدئ (A1-A2)</option>
                    <option value="متوسط (B1-B2)">متوسط (B1-B2)</option>
                    <option value="متقدم (C1-C2)">متقدم (C1-C2)</option>
                </select>
            </div>
            <!-- خانة تابعة لأستاذ الطالب -->
            <div class="form-group">
                <select id="teacher" required>
                    <option value="">اختر الأستاذ</option>
                    <option value="أستاذ أحمد">أستاذ أحمد</option>
                    <option value="أستاذة سارة">أستاذة سارة</option>
                    <option value="أستاذ محمد">أستاذ محمد</option>
                    <option value="أستاذة فاطمة">أستاذة فاطمة</option>
                </select>
            </div>
            <div class="form-group">
                <select id="payment" required>
                    <option value="خالص">تم الدفع (خالص)</option>
                    <option value="غير خالص">غير خالص (معلق)</option>
                </select>
            </div>
            <button type="submit" class="btn-add">إضافة طالب جديد</button>
        </form>

        <!-- حقل البحث -->
        <div class="form-group" style="margin-top: 20px;">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن اسم الطالب..." onkeyup="filterStudents()">
        </div>

        <!-- جدول الطلاب -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>اللغة</th>
                        <th>المستوى</th>
                        <th>الأستاذ</th>
                        <th>حالة الدفع</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
            </table>
        </div>

        <!-- قسم إحصائيات الأساتذة -->
        <div class="stats-box">
            <h3>📊 إحصائيات الأساتذة</h3>
            <table>
                <thead>
                    <tr>
                        <th>اسم الأستاذ</th>
                        <th>عدد الطلاب المسجلين</th>
                    </tr>
                </thead>
                <tbody id="teachersTable"></tbody>
            </table>
        </div>

        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>
</div>

<script>
    let students = JSON.parse(localStorage.getItem('academy_students')) || [];

    function login() {
        const pin = document.getElementById('pinInput').value;
        if (pin === '0808') {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadStudents();
        } else {
            alert('رمز PIN غير صحيح!');
        }
    }

    function logout() {
        document.getElementById('pinInput').value = '';
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
    }

    function filterStudents() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const rows = document.querySelectorAll('#studentsTable tr');

        rows.forEach(row => {
            const nameCell = row.cells[0]; 
            if (nameCell) {
                const studentName = nameCell.textContent.toLowerCase();
                row.style.display = studentName.includes(query) ? '' : 'none';
            }
        });
    }

    function loadStudents() {
        const tbody = document.getElementById('studentsTable');
        tbody.innerHTML = '';
        
        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">لا يوجد طلاب مسجلون حالياً</td></tr>';
        } else {
            students.forEach((student, index) => {
                const tr = document.createElement('tr');
                const isPaid = student.payment === 'خالص';
                
                tr.innerHTML = `
                    <td>${student.name}</td>
                    <td>${student.language}</td>
                    <td>${student.level}</td>
                    <td><b>${student.teacher || 'غير محدد'}</b></td>
                    <td>
                        <span class="badge ${isPaid ? 'badge-success' : 'badge-danger'}">
                            ${student.payment}
                        </span>
                    </td>
                    <td>${student.date}</td>
                    <td><button class="btn-delete" onclick="deleteStudent(${index})">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // تحديث جدول إحصائيات الأساتذة
        updateTeacherStats();
    }

    function updateTeacherStats() {
        const teachersTbody = document.getElementById('teachersTable');
        teachersTbody.innerHTML = '';

        // حصر الأساتذة وعدد طلاب كل واحد
        const teacherCounts = {};

        students.forEach(student => {
            const tName = student.teacher || 'غير محدد';
            teacherCounts[tName] = (teacherCounts[tName] || 0) + 1;
        });

        const teachers = Object.keys(teacherCounts);

        if (teachers.length === 0) {
            teachersTbody.innerHTML = '<tr><td colspan="2">لا توجد بيانات متاحة</td></tr>';
            return;
        }

        teachers.forEach(teacher => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${teacher}</td>
                <td><span class="teacher-badge">${teacherCounts[teacher]} طالب</span></td>
            `;
            teachersTbody.appendChild(tr);
        });
    }

    function addStudent(e) {
        e.preventDefault();
        
        const newStudent = {
            id: Date.now(),
            name: document.getElementById('name').value,
            language: document.getElementById('language').value,
            level: document.getElementById('level').value,
            teacher: document.getElementById('teacher').value,
            payment: document.getElementById('payment').value,
            date: new Date().toLocaleDateString('ar-EG')
        };

        students.push(newStudent);
        localStorage.setItem('academy_students', JSON.stringify(students));
        
        document.getElementById('studentForm').reset();
        loadStudents();
    }

    function deleteStudent(index) {
        if (confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
            students.splice(index, 1);
            localStorage.setItem('academy_students', JSON.stringify(students));
            loadStudents();
        }
    }
</script>

</body>
</html>
