<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Online</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            width: 100%; 
            max-width: 800px; 
        }

        h1, h2, h3 { text-align: center; color: var(--text-main); margin-bottom: 20px; font-weight: 700; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        
        input, select { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 0.95rem; 
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-add { background-color: var(--success); color: white; margin-top: 5px; }
        .btn-add:hover { background-color: #059669; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-delete { background-color: #fee2e2; color: var(--danger); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; width: auto; }
        .btn-delete:hover { background-color: var(--danger); color: white; }
        .btn-logout { background-color: #64748b; color: white; margin-top: 25px; }
        .btn-logout:hover { background-color: #475569; }

        .table-container { overflow-x: auto; margin-top: 15px; border: 1px solid var(--border-color); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9rem; white-space: nowrap; }
        th { background-color: #0f172a; color: white; padding: 12px 14px; font-weight: 600; }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
        tr:last-child td { border-bottom: none; }

        .badge { padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; display: inline-block; }
        .badge-success { background-color: #d1fae5; color: #065f46; }
        .badge-danger { background-color: #fee2e2; color: #991b1b; }

        .stats-box { background-color: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-top: 25px; }
        .teacher-badge { background-color: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; font-weight: 700; }
        
        .manage-teachers-section {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .auth-screen { text-align: center; padding: 30px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة الدخول -->
    <div id="authScreen" class="auth-screen">
        <h2>🎓 Academy Online</h2>
        <div class="form-group" style="margin-top: 20px;">
            <input type="password" id="pinInput" placeholder="أدخل رمز الدخول (PIN)">
        </div>
        <button class="btn btn-primary" id="loginBtn">دخول</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="appScreen" class="hidden">
        <h1>🎓 Academy Online</h1>
        
        <form id="studentForm">
            <div class="form-group">
                <input type="text" id="name" placeholder="اسم الطالب" required>
            </div>
            <div class="form-group">
                <select id="language" required>
                    <option value="">اختر اللغة</option>
                    <option value="الإنجليزية">الإنجليزية</option>
                    <option value="الفرنسية">الفرنسية</option>
                    <option value="الإسبانية">الإسبانية</option>
                    <option value="الألمانية">الألمانية</option>
                    <option value="التركية">التركية</option>
                </select>
            </div>
            <div class="form-group">
                <select id="level" required>
                    <option value="">اختر المستوى</option>
                    <option value="مبتدئ (A1-A2)">مبتدئ (A1-A2)</option>
                    <option value="متوسط (B1-B2)">متوسط (B1-B2)</option>
                    <option value="متقدم (C1-C2)">متقدم (C1-C2)</option>
                </select>
            </div>
            
            <div class="form-group">
                <select id="teacherSelect" required>
                    <!-- يتم التحميل ديناميكياً -->
                </select>
            </div>

            <div class="form-group">
                <select id="payment" required>
                    <option value="خالص">تم الدفع (خالص)</option>
                    <option value="غير خالص">غير خالص (معلق)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-add">إضافة طالب جديد</button>
        </form>

        <!-- حقل البحث -->
        <div class="form-group" style="margin-top: 20px;">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن اسم الطالب...">
        </div>

        <!-- جدول عرض الطلاب -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>اللغة</th>
                        <th>المستوى</th>
                        <th>الأستاذ</th>
                        <th>حالة الدفع</th>
                        <th>تاريخ التسجيل</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTable"></tbody>
            </table>
        </div>

        <!-- قسم إحصائيات وإدارة الأساتذة -->
        <div class="stats-box">
            <h3> إدارة الأساتذة</h3>
            
            <div class="manage-teachers-section">
                <input type="text" id="newTeacherInput" placeholder="أضف أستاذ جديد...">
                <button type="button" class="btn btn-primary" id="addTeacherBtn" style="width: auto;">إضافة</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>اسم الأستاذ</th>
                            <th>عدد الطلاب المسجلين</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTable"></tbody>
                </table>
            </div>
        </div>

        <button class="btn btn-logout" id="logoutBtn">تسجيل الخروج</button>
    </div>
</div>

<script>
    // التهيئة والبيانات المبدئية
    let students = JSON.parse(localStorage.getItem('academy_students')) || [];
    let teachers = JSON.parse(localStorage.getItem('academy_teachers')) || ['أستاذ أحمد', 'أستاذة سارة'];

    // عناصر الصفحة
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const studentForm = document.getElementById('studentForm');
    const searchInput = document.getElementById('searchInput');
    const teacherSelect = document.getElementById('teacherSelect');
    const addTeacherBtn = document.getElementById('addTeacherBtn');
    const newTeacherInput = document.getElementById('newTeacherInput');

    // تسجيل الدخول
    loginBtn.addEventListener('click', () => {
        const pin = document.getElementById('pinInput').value;
        if (pin === '0808') {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            renderAll();
        } else {
            alert('رمز PIN غير صحيح!');
        }
    });

    // تسجيل الخروج
    logoutBtn.addEventListener('click', () => {
        document.getElementById('pinInput').value = '';
        appScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
    });

    // إضافة أستاذ جديد
    addTeacherBtn.addEventListener('click', () => {
        const teacherName = newTeacherInput.value.trim();
        if (teacherName && !teachers.includes(teacherName)) {
            teachers.push(teacherName);
            saveData();
            newTeacherInput.value = '';
            renderAll();
        }
    });

    // إضافة طالب جديد
    studentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const newStudent = {
            id: Date.now(),
            name: document.getElementById('name').value.trim(),
            language: document.getElementById('language').value,
            level: document.getElementById('level').value,
            teacher: teacherSelect.value,
            payment: document.getElementById('payment').value,
            date: new Date().toLocaleDateString('ar-EG')
        };

        students.push(newStudent);
        saveData();
        studentForm.reset();
        renderAll();
    });

    // حذف طالب
    function deleteStudent(id) {
        if (confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
            students = students.filter(student => student.id !== id);
            saveData();
            renderAll();
        }
    }

    // حذف أستاذ
    function deleteTeacher(teacherName) {
        if (confirm(`هل أنت متأكد من حذف ${teacherName}؟`)) {
            teachers = teachers.filter(t => t !== teacherName);
            saveData();
            renderAll();
        }
    }

    // البحث الفوري
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        const rows = document.querySelectorAll('#studentsTable tr');

        rows.forEach(row => {
            const nameCell = row.cells[0];
            if (nameCell) {
                const studentName = nameCell.textContent.toLowerCase();
                row.style.display = studentName.includes(query) ? '' : 'none';
            }
        });
    });

    // تحديث خيارات الأساتذة
    function renderTeacherOptions() {
        teacherSelect.innerHTML = '<option value="">اختر الأستاذ</option>';
        teachers.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t;
            teacherSelect.appendChild(opt);
        });
    }

    // عرض جدول الطلاب
    function renderStudentsTable() {
        const tbody = document.getElementById('studentsTable');
        tbody.innerHTML = '';

        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا يوجد طلاب مسجلون حالياً</td></tr>';
            return;
        }

        students.forEach((student) => {
            const tr = document.createElement('tr');
            const isPaid = student.payment === 'خالص';
            
            tr.innerHTML = `
                <td><b>${student.name}</b></td>
                <td>${student.language}</td>
                <td>${student.level}</td>
                <td>${student.teacher || 'غير محدد'}</td>
                <td>
                    <span class="badge ${isPaid ? 'badge-success' : 'badge-danger'}">
                        ${student.payment}
                    </span>
                </td>
                <td>${student.date}</td>
                <td><button class="btn btn-delete" onclick="deleteStudent(${student.id})">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // عرض جدول وإحصائيات الأساتذة
    function renderTeachersTable() {
        const tbody = document.getElementById('teachersTable');
        tbody.innerHTML = '';

        const teacherCounts = {};
        teachers.forEach(t => teacherCounts[t] = 0);
        
        students.forEach(s => {
            if (s.teacher && teacherCounts.hasOwnProperty(s.teacher)) {
                teacherCounts[s.teacher]++;
            }
        });

        teachers.forEach(t => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${t}</b></td>
                <td><span class="teacher-badge">${teacherCounts[t]} طالب</span></td>
                <td><button class="btn btn-delete" onclick="deleteTeacher('${t}')">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // حفظ البيانات
    function saveData() {
        localStorage.setItem('academy_students', JSON.stringify(students));
        localStorage.setItem('academy_teachers', JSON.stringify(teachers));
    }

    // إعادة رسم كل العناصر
    function renderAll() {
        renderTeacherOptions();
        renderStudentsTable();
        renderTeachersTable();
    }
</script>

</body>
</html>
